<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>企业制度助手</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside id="settingsPanel" class="sidebar" aria-label="会话设置">
        <header class="brand">
          <div class="brand-mark">律</div>
          <div>
            <h1>企业制度助手</h1>
            <p>会话设置</p>
          </div>
          <button id="closeSettings" class="icon-button close-settings" type="button" aria-label="关闭设置">×</button>
        </header>

        <section class="panel">
          <label>
            <span>User ID</span>
            <input id="userId" value="user_test" autocomplete="off" />
          </label>

          <label>
            <span>Thread ID</span>
            <input id="threadId" placeholder="留空创建新会话" autocomplete="off" />
          </label>

          <label>
            <span>Agent Role</span>
            <select id="agentRole">
              <option value="enterprise_policy_advisor" selected>企业规章制度顾问</option>
              <option value="">自定义提示词 / custom prompt</option>
              <option value="director">director</option>
              <option value="cinematographer">cinematographer</option>
              <option value="art_director">art_director</option>
              <option value="screenwriter">screenwriter</option>
              <option value="storyboard_artist">storyboard_artist</option>
            </select>
          </label>

          <label>
            <span>Agent Prompt</span>
            <textarea
              id="agentPrompt"
              rows="7"
              placeholder="选择 custom prompt 且 Thread ID 为空时，这里会作为新会话的系统提示词"
            ></textarea>
          </label>

          <section class="skill-picker" aria-labelledby="skillPickerLabel">
            <span id="skillPickerLabel">激活技能</span>
            <p>默认关闭；仅在创建新会话时可选择。</p>
            <div id="skillOptions" class="skill-options">正在加载技能列表…</div>
          </section>

        </section>

        <section class="panel actions">
          <button id="newThread" type="button">开始新会话</button>
          <button id="fillPrompt" class="secondary-button" type="button">使用自定义提示词</button>
        </section>

        <section class="panel meta">
          <div>
            <span>Run</span>
            <strong id="runId">-</strong>
          </div>
          <div>
            <span>Status</span>
            <strong id="configStatus">idle</strong>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div class="topbar-brand">
            <div class="brand-mark">律</div>
            <div>
              <strong>企业制度助手</strong>
              <span id="status">准备就绪</span>
            </div>
          </div>
          <div class="topbar-actions">
            <button id="topNewThread" class="text-button" type="button">新对话</button>
            <button id="settingsToggle" class="text-button" type="button" aria-expanded="false">会话设置</button>
          </div>
        </header>
        <div id="messages" class="messages"></div>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="2" placeholder="请输入制度、流程或条款相关问题"></textarea>
          <div class="composer-row">
            <input id="imageUrl" placeholder="图片 URL（可选）" autocomplete="off" />
            <button id="send" type="submit">发送 <span>↑</span></button>
          </div>
          <p class="composer-hint">回答仅供制度查询参考，请以公司正式制度及审批结果为准。</p>
        </form>
      </section>
    </main>

    <script src="/static/app.js?v=20260921-demo-product"></script>
  </body>
</html>
